[project]
name = "activity-report"
version = "0.1.0"
description = "Weekly Convergint activity report generator and local controls"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "playwright>=1.52,<2",
  "pypdf>=5.5,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false
