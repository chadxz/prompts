name: wt-stack CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wt-stack-ci.yml"
      - ".github/workflows/wt-stack-release.yml"
      - "apps/wt-stack/**"
      - "install.sh"
      - "setup-common.sh"
      - "setup_claude_code.sh"
      - "setup_codex.sh"
      - "setup_pi.sh"
  pull_request:
    paths:
      - ".github/workflows/wt-stack-ci.yml"
      - ".github/workflows/wt-stack-release.yml"
      - "apps/wt-stack/**"
      - "install.sh"
      - "setup-common.sh"
      - "setup_claude_code.sh"
      - "setup_codex.sh"
      - "setup_pi.sh"

permissions:
  contents: read

concurrency:
  group: wt-stack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    defaults:
      run:
        working-directory: apps/wt-stack
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          working_directory: apps/wt-stack

      - name: Run validation
        run: mise run ci

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wt-stack-coverage-${{ matrix.os }}
          path: |
            apps/wt-stack/dist/coverage.html
            apps/wt-stack/dist/coverage.out

      - name: Validate setup scripts
        working-directory: .
        run: bash -n install.sh setup-common.sh setup_claude_code.sh setup_codex.sh setup_pi.sh
