interface:
  display_name: "Reporting Work Activity"
  short_description: >
    Rebuild current activity reports or give them a distinctly new UI
  default_prompt: >
    Use $reporting-work-activity to lock the latest reporting window,
    choose personal or org scope, refresh every evidence source and the
    snapshot-backed narrative, rebuild and verify the weekly report, and
    include a visually checked single-page PDF. Apply a genuinely distinct
    visual system when a redesign is requested.
