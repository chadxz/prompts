[tools]
python = "3.14"
uv = "latest"

[tasks.setup]
description = "Create the local virtualenv and install dev dependencies"
run = "uv sync --dev"

[tasks.fetch]
description = "Fetch the local GitHub and Linear snapshots used by the report"
run = "uv run python populate_data.py"

[tasks.bootstrap-tracked-sources]
description = "Seed tracked_sources.json from local snapshots or dist output"
run = "uv run python bootstrap_tracked_sources.py"

[tasks.clear-cache]
description = "Clear generated snapshots and report output"
run = "uv run python clear_runtime_cache.py"

[tasks.report]
description = "Regenerate the HTML report, drill-down pages, and one-page PDF"
run = "uv run python build_report.py"

[tasks.pdf]
description = "Re-export the generated HTML report as a single-page PDF"
run = "uv run python export_single_page_pdf.py"

[tasks.verify-report]
description = "Verify the selected window, narrative, HTML, and local links"
run = "uv run python verify_report.py"

[tasks.serve]
description = "Run the local report controls server"
run = "uv run python report_server.py"

[tasks.format]
description = "Format the Python code"
run = "uv run ruff format ."

[tasks.format-check]
description = "Check formatting without changing files"
run = "uv run ruff format --check ."

[tasks.lint]
description = "Run Ruff lint checks"
run = "uv run ruff check ."

[tasks.test]
description = "Run the smoke tests"
run = "uv run pytest"

[tasks.check]
description = "Run formatting checks, linting, and tests"
depends = ["format-check", "lint", "test"]
